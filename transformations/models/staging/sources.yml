version: 2

sources:
  - name: raw
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: recomendacion_planes
    tables:
      - name: swipes_raw
        description: "Mensajes crudos de Pub/Sub topic swipe-events. Schema fijado por la suscripción BQ con write_metadata=true."
        loaded_at_field: publish_time
        freshness:
          warn_after: {count: 1, period: hour}
          error_after: {count: 6, period: hour}
        columns:
          - name: subscription_name
            data_type: string
          - name: message_id
            data_type: string
          - name: publish_time
            data_type: timestamp
          - name: data
            description: "Payload JSON serializado por portal-api, compatible con swipe_event_contract_v2."
            data_type: string
          - name: attributes
            data_type: string

  - name: catalog
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: recomendacion_planes
    tables:
      - name: eventos
        description: "Catalogo de eventos usado como fallback cuando el snapshot del swipe no trae todos los metadatos."

  - name: app
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: recomendacion_planes
    tables:
      - name: user_preferences
        description: "Preferencias de usuario replicadas desde portal-api para consumo analitico."
        columns:
          - name: user_id
            data_type: string
          - name: preferred_location
            data_type: string
          - name: preferred_location_lat
            data_type: float64
          - name: preferred_location_lng
            data_type: float64
          - name: preferred_budget
            data_type: string
          - name: synced_at
            data_type: timestamp
