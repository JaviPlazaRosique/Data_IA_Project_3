version: 2

models:
  - name: int_user_swipe_features_30d
    description: "Features agregadas por usuario usando swipes de los ultimos 30 dias."
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: total_swipes_30d
        description: "Numero total de swipes en la ventana de 30 dias."
      - name: right_swipe_rate_30d
        description: "Ratio de swipes positivos en la ventana."
      - name: avg_dwell_ms_30d
        description: "Tiempo medio de permanencia de la tarjeta antes del swipe."
      - name: avg_right_dwell_ms_30d
        description: "Tiempo medio de permanencia solo en swipes positivos."

  - name: int_user_swipe_features_90d
    description: "Features agregadas por usuario usando swipes de los ultimos 90 dias."
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: total_swipes_90d
        description: "Numero total de swipes en la ventana de 90 dias."
      - name: right_swipe_rate_90d
        description: "Ratio de swipes positivos en la ventana."
      - name: avg_dwell_ms_90d
        description: "Tiempo medio de permanencia de la tarjeta antes del swipe."
      - name: avg_right_dwell_ms_90d
        description: "Tiempo medio de permanencia solo en swipes positivos."
