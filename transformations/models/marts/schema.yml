version: 2

models:
  - name: fct_swipes
    description: "Tabla de hechos de swipes enriquecida con metadatos del evento."
    columns:
      - name: interaction_id
        description: "ID único de la interacción (Pub/Sub message_id)."
        data_tests:
          - not_null:
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
          - unique:
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
      - name: event_timestamp
        description: "Momento del swipe."
        data_tests:
          - not_null:
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
      - name: schema_version
        description: "Version del contrato del payload original, si fue informada por el cliente."
      - name: user_id
        description: "Usuario autenticado."
        data_tests:
          - not_null:
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
      - name: session_id
        description: "Sesión cuando no hay usuario autenticado o como apoyo analítico."
      - name: event_id
        description: "Evento mostrado."
        data_tests:
          - not_null:
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
      - name: interaction_type
        description: "Siempre 'swipe' en este caso."
        data_tests:
          - not_null:
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
          - accepted_values:
              values: ['swipe']
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
      - name: swipe_direction
        description: "'right' o 'left'."
        data_tests:
          - not_null:
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
          - accepted_values:
              values: ['left', 'right']
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
      - name: liked
        description: "true si right, false si left."
        data_tests:
          - not_null:
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"
      - name: dwell_ms
        description: "Milisegundos que la tarjeta estuvo visible antes de hacer swipe."
      - name: recommendation_context
        description: "Origen de la recomendacion: swipe, chat, etc."
      - name: rank_position
        description: "Posicion del evento en el ranking o deck cuando se mostro."
      - name: recommendation_id
        description: "ID de trazabilidad de la recomendacion."
      - name: producer_surface
        description: "Superficie cliente que produjo el evento."
      - name: producer_client_version
        description: "Version del cliente frontend, si esta disponible."
      - name: segmento
        description: "Segmento del evento, priorizando el snapshot del swipe y usando catalogo como fallback."
      - name: genero
        description: "Genero del evento, priorizando el snapshot del swipe y usando catalogo como fallback."
      - name: subgenero
        description: "Subgenero del evento, priorizando el snapshot del swipe y usando catalogo como fallback."
      - name: ciudad
        description: "Ciudad del evento, priorizando el snapshot del swipe y usando catalogo como fallback."
      - name: precio_min
        description: "Precio minimo del evento enviado en el snapshot."
      - name: precio_max
        description: "Precio maximo del evento enviado en el snapshot."
      - name: banda_precio
        description: "Banda de precio del evento, priorizando snapshot y usando catalogo como fallback."
      - name: fecha_evento
        description: "Fecha del evento, priorizando el snapshot del swipe y usando catalogo como fallback."
      - name: recinto_id
        description: "ID del recinto, priorizando el snapshot del swipe y usando catalogo como fallback."
      - name: ingestion_timestamp
        description: "Momento de escritura técnica (Pub/Sub publish_time)."
        data_tests:
          - not_null:
              config:
                where: "ingestion_timestamp > timestamp_sub(current_timestamp(), interval 7 day)"

  - name: dim_user_cluster_features_current
    description: "Tabla actual de features por usuario lista para exportar y entrenar clustering."
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: total_swipes_30d
        description: "Volumen de swipes en 30 dias."
      - name: total_swipes_90d
        description: "Volumen de swipes en 90 dias."
      - name: right_swipe_rate_delta_30_vs_90
        description: "Cambio de afinidad reciente frente a la ventana larga."
      - name: total_swipes_delta_30_vs_90
        description: "Cambio de volumen reciente frente a la ventana larga."
