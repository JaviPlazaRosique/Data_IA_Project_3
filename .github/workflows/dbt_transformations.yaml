name: cicd_dbt_transformations

on:
  push:
    branches:
      - main
    paths:
      - 'transformations/**'
  pull_request:
    branches:
      - main
    paths:
      - 'transformations/**'

permissions:
  id-token: write
  contents: read

env:
  REGION: europe-west1
  REPO: repo-recomendador-eventos
  JOB: dbt-transformations

jobs:
  ci:
    name: Build imagen dbt
    runs-on: ubuntu-latest

    steps:
      - name: Cargar repo
        uses: actions/checkout@v4

      - name: Build imagen dbt
        run: docker build -t dbt-test transformations/

  cd:
    if: github.ref == 'refs/heads/main'
    name: Build, push y actualizar job
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Cargar repo
        uses: actions/checkout@v4

      - name: Autenticacion GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.DBT_CUENTA_SERVICIO }}

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push imagen dbt
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.JOB }}"
          docker build -t "${IMAGE}:latest" transformations/
          docker push "${IMAGE}:latest"

      - name: Actualizar imagen en Cloud Run Job
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.JOB }}"
          gcloud run jobs update ${{ env.JOB }} \
            --image="${IMAGE}:latest" \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }}
