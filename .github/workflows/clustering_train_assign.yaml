name: cicd_clustering_train_assign

on:
  push:
    branches:
      - main
    paths:
      - 'clustering/**'
  pull_request:
    branches:
      - main
    paths:
      - 'clustering/**'

permissions:
  id-token: write
  contents: read

env:
  REGION: europe-west1
  REPO: repo-recomendador-eventos
  JOB: clustering-train-assign
  DOCKERFILE: clustering/2_integracion_datos_gcp/gcp_batch/Dockerfile

jobs:
  ci:
    name: Validar job de clustering
    runs-on: ubuntu-latest

    steps:
      - name: Cargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validar sintaxis Python
        run: |
          python -m py_compile \
            clustering/2_integracion_datos_gcp/gcp_batch/job_main.py \
            clustering/2_integracion_datos_gcp/step_4_entrenar_desde_feature_export.py \
            clustering/4_serving_recomendaciones_cluster/step_1_load_cluster_outputs.py \
            clustering/4_serving_recomendaciones_cluster/step_2_build_cluster_event_affinity.py \
            clustering/4_serving_recomendaciones_cluster/step_3_generate_user_recommendation_candidates.py \
            clustering/4_serving_recomendaciones_cluster/step_4_validate_serving_outputs.py

      - name: Test build imagen
        run: docker build --check -f ${{ env.DOCKERFILE }} .

  cd:
    if: github.ref == 'refs/heads/main'
    name: Build, push y actualizar job
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Cargar repo
        uses: actions/checkout@v4

      - name: Autenticacion GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.CLUSTERING_CUENTA_SERVICIO }}

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build y push imagen clustering
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.JOB }}"
          docker build -t "${IMAGE}:latest" -f "${{ env.DOCKERFILE }}" .
          docker push "${IMAGE}:latest"

      - name: Actualizar imagen en Cloud Run Job
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.JOB }}"
          gcloud run jobs update ${{ env.JOB }} \
            --image="${IMAGE}:latest" \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }}
