name: cicd_agent_rag

on:
  push:
    branches:
      - main
    paths:
      - 'agent/**'
  pull_request:
    branches:
      - main
    paths:
      - 'agent/**'

permissions:
  id-token: write
  contents: read

env:
  REGION: europe-west1
  SERVICIO: portal-api

jobs:
  ci:
    name: Verificar importacion
    runs-on: ubuntu-latest

    steps:
      - name: Cargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Instalar dependencias
        run: pip install -r agent/requirements.txt

      - name: Verificar importacion del agente
        run: python -c "from agent.agent import root_agent; assert root_agent is not None, 'root_agent no cargado'"
        env:
          APP_PROJECT_ID: test-project-000000
          GOOGLE_GENAI_USE_VERTEXAI: 'FALSE'

  cd:
    if: github.ref == 'refs/heads/main'
    name: Desplegar Agent Engine
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Cargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Instalar dependencias
        run: pip install -r agent/requirements.txt

      - name: Autenticacion GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.AGENT_RAG_CUENTA_SERVICIO }}

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validar secret de staging bucket
        env:
          STAGING_BUCKET: ${{ secrets.AGENT_STAGING_BUCKET }}
        run: |
          if [ -z "$STAGING_BUCKET" ]; then
            echo "ERROR: el secret AGENT_STAGING_BUCKET está vacío o no existe en este repo." >&2
            exit 1
          fi
          echo "AGENT_STAGING_BUCKET configurado (len=${#STAGING_BUCKET}, sufijo=…${STAGING_BUCKET: -4})"

      - name: Asegurar staging bucket
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STAGING_BUCKET: ${{ secrets.AGENT_STAGING_BUCKET }}
        run: |
          BUCKET="${STAGING_BUCKET#gs://}"
          BUCKET="${BUCKET%/}"
          URI="gs://${BUCKET}"

          if gcloud storage buckets describe "$URI" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Bucket $URI ya existe."
          else
            echo "Bucket $URI no existe. Creándolo en $REGION…"
            gcloud storage buckets create "$URI" \
              --project="$PROJECT_ID" \
              --location="$REGION" \
              --uniform-bucket-level-access
          fi

      - name: Desplegar Agent Engine
        run: python -m agent.runtime.deploy_agent_engine
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ env.REGION }}
          STAGING_BUCKET: ${{ secrets.AGENT_STAGING_BUCKET }}
          AGENT_ENGINE_SA: rag-agent-engine-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Actualizar AGENT_ENGINE_RESOURCE_NAME en Cloud Run
        run: |
          RESOURCE_NAME=$(python -c "import json; print(json.load(open('.agent_engine_resource.json'))['resource_name'])")
          gcloud run services update "$SERVICIO" \
            --update-env-vars="AGENT_ENGINE_RESOURCE_NAME=${RESOURCE_NAME}" \
            --region="$REGION" \
            --project="$PROJECT_ID"
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
